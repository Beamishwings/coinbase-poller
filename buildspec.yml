version: 0.2
phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 817615305328.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=817615305328.dkr.ecr.us-east-1.amazonaws.com/bchauder-agent
      - IMAGE_TAG=latest

  build:
    commands:
      - echo Building the Coinbase agent Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Generating ECS deployment file...
      - printf '[{"name":"bchauder-agent","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
